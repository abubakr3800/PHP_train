<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Firebase Bootstrap Demo</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  
  <!-- Firebase Core -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <!-- Firebase Auth -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

  <div class="container py-5">
    <h2 class="text-center mb-4">🔥 Firebase Auth Demo</h2>

    <div class="text-center mb-4">
      <button class="btn btn-primary" onclick="login()">🔐 Sign in with Google</button>
      <button class="btn btn-secondary d-none" onclick="logout()" id="logoutBtn">🚪 Logout</button>
      <p class="mt-3" id="userInfo" style="font-weight: 500;"></p>
    </div>

    <!-- Input -->
    <div class="input-group mb-4"id="protectedForm">
      <input type="text" id="nameInput" class="form-control" placeholder="Enter your name" />
      <button class="btn btn-primary" onclick="addName()">Add</button>
    </div>

    <!-- محتوى يظهر بعد تسجيل الدخول -->
    <div id="protectedContent" class="row"></div>
  </div>


  <script>
    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
        apiKey: "AIzaSyCZigNjL2242LVnPMEMYT5-Prr9i32-WnI",
        authDomain: "session-f6013.firebaseapp.com",
        databaseURL: "https://session-f6013-default-rtdb.firebaseio.com",
        projectId: "session-f6013",
        storageBucket: "session-f6013.firebasestorage.app",
        messagingSenderId: "580324403348",
        appId: "1:580324403348:web:06a6288be50e3e399aac81",
        measurementId: "G-9E39DM13K0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged(user => {
        if (user) {
            // ✅ فيه مستخدم متسجل
            currentUser = user;
            document.getElementById("userInfo").textContent = `👋 Welcome, ${user.displayName}`;
            document.getElementById("logoutBtn").classList.remove("d-none");
            console.log(user);
            
            // لو عندك دالة بتعرض الداتا للمستخدم:
            showUserTasks?.(); // ? تتأكد إنها موجودة قبل استدعائها
        } else {
            // ❌ المستخدم مش مسجل دخول
            currentUser = null;
            document.getElementById("userInfo").textContent = "";
            document.getElementById("logoutBtn").classList.add("d-none");
            document.getElementById("protectedContent").innerHTML = "";
            document.getElementById("protectedForm").innerHTML = "";
        }
    });

function login() {
  // تأكد أن firebase.auth موجود
  const provider = new firebase.auth.GoogleAuthProvider();

  firebase.auth().signInWithPopup(provider)
    .then(result => {
      const user = result.user;
      document.getElementById("userInfo").textContent = `👋 Welcome, ${user.displayName}`;
      document.getElementById("logoutBtn").classList.remove("d-none");
      currentUser = user;
    //   showUserTasks();
    })
    .catch(error => {
      console.error("Login Error:", error.message);
      alert("❌ Login failed: " + error.message);
    });
}


    function logout() {
        // استدعاء تسجيل الخروج من Firebase
        firebase.auth().signOut()
            .then(() => {
              // إزالة بيانات المستخدم من الواجهة
              document.getElementById("userInfo").textContent = "";

              // إخفاء زر الخروج
              document.getElementById("logoutBtn").classList.add("d-none");

              // إخفاء البيانات الخاصة بالمستخدم
              document.getElementById("protectedForm").innerHTML = "";

              // إلغاء المتغير الخاص بالمستخدم الحالي
              currentUser = null;
            })
            .catch(error => {
              console.error("Logout Error:", error.message);
              alert("❌ Logout failed: " + error.message);
            });
    }
  </script>
  <script>
    function showUserTasks() {
        console.log("🎯 showUserTasks is called — ready to fetch data!");
        // هنا ممكن تحط أي كود لجلب بيانات المستخدم من Firestore
        db.collection("names").orderBy("createdAt", "desc").get().then(snapshot => {
            const list = document.getElementById("protectedContent");
            const Form = document.getElementById("protectedForm");
            list.innerHTML = "";

            snapshot.forEach(doc => {
            const data = doc.data();
            const name = data.name;
            const createdAt = data.createdAt?.toDate().toLocaleString() || "Loading...";

            const card = `
                <div class="col-lg-4 col-md-6 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                    <h5 class="card-title">${name}</h5>
                    <p class="card-text text-muted">🕒 ${createdAt}</p>
                    </div>
                </div>
                </div>
            `;
            list.innerHTML += card;
            Form.innerHTML = `
                        <input type="text" id="nameInput" class="form-control" placeholder="Enter your name" />
                        <button class="btn btn-primary" onclick="addName()">Add</button>`;
            });
            }).catch(error => {
                console.error("Error fetching user tasks:", error.message);
                alert("❌ Error fetching user tasks: " + error.message);
        });
    }
  </script>

</body>
</html>
