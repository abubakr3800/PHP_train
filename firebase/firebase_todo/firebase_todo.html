
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Firebase To-Do App</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">
  <div class="container">
    <h1 class="text-center mb-4">📝 Firebase To-Do App</h1>
    <div class="text-center mb-4">
      <button class="btn btn-primary" onclick="login()">🔐 Login with Google</button>
      <button class="btn btn-secondary d-none" onclick="logout()" id="logoutBtn">🚪 Logout</button>
      <p class="mt-2" id="userInfo"></p>
    </div>
    <div class="input-group mb-3">
      <input type="text" id="taskInput" class="form-control" placeholder="Add new task" />
      <button class="btn btn-success" onclick="addTask()">➕ Add</button>
    </div>
    <ul class="list-group" id="taskList"></ul>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCZigNjL2242LVnPMEMYT5-Prr9i32-WnI",
      authDomain: "session-f6013.firebaseapp.com",
      projectId: "session-f6013",
      storageBucket: "session-f6013.firebasestorage.app",
      messagingSenderId: "580324403348",
      appId: "1:580324403348:web:06a6288be50e3e399aac81",
      measurementId: "G-9E39DM13K0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let currentUser = null;
    function login() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider).then(result => {
        currentUser = result.user;
        document.getElementById("userInfo").innerText = `👋 Welcome, ${currentUser.displayName}`;
        document.getElementById("logoutBtn").classList.remove("d-none");
        showUserTasks();
      });
    }
    function logout() {
      auth.signOut().then(() => {
        currentUser = null;
        document.getElementById("userInfo").innerText = "";
        document.getElementById("logoutBtn").classList.add("d-none");
        document.getElementById("taskList").innerHTML = "";
      });
    }
    function addTask() {
      let taskText = document.getElementById("taskInput").value.trim();
      if (!taskText || !currentUser) return;
      db.collection("tasks").add({
        title: taskText,
        uid: currentUser.uid,
        done: false,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        document.getElementById("taskInput").value = "";
      });
      getTasks();
    }

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        document.getElementById("userInfo").innerText = `👋 Welcome, ${user.displayName}`;
        document.getElementById("logoutBtn").classList.remove("d-none");
        showUserTasks();
      }
    });

    getTasks();    
    
    function getTasks() {
        db.collection("tasks").get().then(snapshot => {
          const taskList = document.getElementById("taskList");
          taskList.innerHTML = "";
          snapshot.forEach(doc => {
            const task = doc.data();
            const li = document.createElement("li");
            li.textContent = task.title;
            taskList.appendChild(li);
          });
        });
    }
  </script>
</body>
</html>
